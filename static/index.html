<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SanitaSmart</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><span class="eyebrow">CLINICA PRIVATA</span><h1>SanitaSmart</h1></div><div id="account" class="hidden"><span id="user-name"></span><button id="logout" class="secondary">Esci</button></div></header>
<main id="login-view" class="login"><article><h2>Accesso riservato</h2><p>Usa un account demo per entrare.</p><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Accedi</button></form><small>Segreteria: segreteria@sanitasmart.test / Segreteria123!</small></article></main>
<main id="app-view" class="hidden"><section class="intro"><h2>Centro operativo</h2><p id="role-description"></p></section><section id="metrics" class="metrics"></section><section class="grid staff-only"><article><h2>Prenota una visita</h2><form id="appointment-form"><label>Paziente<select name="patientId" id="patient-select" required></select></label><label>Specialita'<input name="specialty" placeholder="es. Cardiologia" required></label><label>Medico<input name="doctor" id="doctor" placeholder="es. Dott.ssa Conti" required></label><div class="row"><label>Data<input name="date" id="visit-date" type="date" required></label><label>Ora<select name="time" id="visit-time" required><option value="">Scegli prima medico e data</option></select></label></div><p id="availability" class="availability"></p><button>Prenota visita</button></form></article><article><h2>Registra paziente</h2><form id="patient-form"><label>Nome e cognome<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Telefono<input name="phone" required></label><button>Aggiungi paziente</button></form></article></section><section class="grid"><article><div class="section-title"><h2>Visite registrate</h2><span id="appointment-count"></span></div><div id="appointments" class="table-wrap"></div></article><article><h2>Referti disponibili</h2><div id="reports" class="report-list"></div></article></section></main><div id="toast" role="status"></div><script src="app.js"></script></body></html>
